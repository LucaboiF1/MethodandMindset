<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Clock Widget</title>
  <style>
    /* 1. Set the page background to pure white (#FFFFFF) */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF; /* Pure white canvas to match Notion */
      display: flex;
      justify-content: center;
      align-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* 2. Clock card container - retains its original aesthetic color */
    .clock-card {
      background-color: #F8F3E9; /* Original cream/beige card color */
      padding: 20px 35px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      text-align: center;
      border: 1px solid #EFE8DA;
    }

    .time {
      font-size: 2.2rem;
      font-weight: 700;
      color: #332F2B;
      letter-spacing: 1px;
    }

    .date {
      font-size: 0.85rem;
      font-weight: 600;
      color: #A09383;
      text-transform: uppercase;
      margin-top: 4px;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="clock-card">
    <div class="time" id="time">00:00:00 p.m.</div>
    <div class="date" id="date">THURSDAY, OCT 8</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      
      // Format time (12-hour format)
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'p.m.' : 'a.m.';
      hours = hours % 12;
      hours = hours ? hours : 12; // 0 becomes 12
      const timeString = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
      
      // Format date
      const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
      const dayName = days[now.getDay()];
      const monthName = months[now.getMonth()];
      const dayNum = now.getDate();
      const dateString = `${dayName}, ${monthName} ${dayNum}`;

      document.getElementById('time').textContent = timeString;
      document.getElementById('date').textContent = dateString;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
