<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Oceanic Weather Bar</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pageBg: '#FFFFFF',
                        oceanBase: '#9ecbdb',
                        oceanDark: '#2e2e2e',
                        cardBg: '#8cbccf',
                        cardHover: '#7baebd',
                    },
                    fontFamily: {
                        display: ['Fredoka', 'sans-serif'],
                        sans: ['Quicksand', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom card styling for precise visual match */
        .weather-card {
            background-color: rgba(140, 188, 207, 0.85);
            border: 1px solid rgba(46, 46, 46, 0.08);
            transition: all 0.2s ease-in-out;
        }
        .weather-card:hover {
            background-color: rgba(123, 174, 189, 0.95);
        }
        .icon-inset {
            background-color: rgba(158, 203, 219, 0.8);
            border: 1px solid rgba(46, 46, 46, 0.08);
        }
    </style>
</head>

<body class="bg-pageBg text-oceanDark font-sans min-h-screen flex items-center justify-center p-3 sm:p-6 antialiased select-none">

    <div class="w-full max-w-4xl bg-oceanBase p-5 sm:p-6 rounded-3xl border-2 border-oceanDark/10 shadow-sm flex flex-col gap-4">

        <!-- Top Navigation & City Search Bar -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-oceanDark/15 pb-4">
            <div class="flex items-center gap-2.5">
                <i data-lucide="waves" class="w-6 h-6 text-oceanDark stroke-[2.2]"></i>
                <span class="font-display font-bold text-sm sm:text-base tracking-wider uppercase text-oceanDark">OCEANIC WEATHER</span>
            </div>

            <!-- Search & Actions -->
            <form onsubmit="handleSearch(event)" class="flex items-center gap-2 w-full sm:w-auto">
                <div class="relative flex-1 sm:w-72">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-oceanDark/60 stroke-[2.2]"></i>
                    <input type="text" id="cityInput" placeholder="Search city (e.g. Brampton, Tokyo)" 
                           class="w-full bg-cardBg/70 text-oceanDark placeholder-oceanDark/60 text-xs font-semibold rounded-full pl-9 pr-4 py-2 border border-oceanDark/15 outline-none focus:bg-cardBg focus:border-oceanDark/40 transition">
                </div>
                <button type="button" onclick="detectLocation()" title="Use Current Location" class="p-2 bg-cardBg/80 hover:bg-cardHover rounded-full border border-oceanDark/15 transition text-oceanDark flex items-center justify-center">
                    <i data-lucide="locate-fixed" class="w-4 h-4 stroke-[2.2]"></i>
                </button>
                <button type="button" onclick="toggleUnit()" id="unitBtn" class="text-xs font-bold px-3 py-2 rounded-full border border-oceanDark/20 bg-cardBg/80 hover:bg-cardHover transition text-oceanDark">
                    °C
                </button>
            </form>
        </div>

        <!-- Main Horizontal Weather Bar Row -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-3.5 items-stretch">
            
            <!-- Left Main Weather Card -->
            <div class="lg:col-span-2 weather-card p-4 sm:p-5 rounded-2xl flex items-center justify-between gap-3 shadow-xs">
                <div class="flex flex-col justify-between h-full space-y-2">
                    <!-- Location -->
                    <div class="flex items-center gap-1.5 text-xs font-bold text-oceanDark/80">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5 stroke-[2.2]"></i>
                        <span id="locationName">Detecting location...</span>
                    </div>

                    <!-- Main Temp & Condition -->
                    <div class="flex items-baseline gap-3 my-1">
                        <span id="currentTemp" class="font-display text-5xl sm:text-6xl font-extrabold tracking-tight">--°</span>
                        <span id="weatherCondition" class="text-sm sm:text-base font-bold text-oceanDark/85">Loading...</span>
                    </div>

                    <!-- High / Low / Feels like -->
                    <div class="flex items-center gap-2 sm:gap-4 text-xs font-bold text-oceanDark/75">
                        <span>H: <span id="tempHigh">--°</span></span>
                        <span>L: <span id="tempLow">--°</span></span>
                        <span>Feels like: <span id="feelsLike">--°</span></span>
                    </div>
                </div>

                <!-- Soft Inset Big Weather Icon Container -->
                <div id="weatherIconContainer" class="p-4 sm:p-5 icon-inset rounded-2xl flex items-center justify-center shrink-0">
                    <i data-lucide="sun" class="w-12 h-12 sm:w-14 sm:h-14 text-oceanDark stroke-[2]"></i>
                </div>
            </div>

            <!-- Right 2x2 Metric Grid -->
            <div class="grid grid-cols-2 gap-2.5">
                
                <!-- Wind Card -->
                <div class="weather-card p-3 sm:p-3.5 rounded-2xl flex items-center gap-3">
                    <i data-lucide="wind" class="w-6 h-6 text-oceanDark/80 stroke-[2] shrink-0"></i>
                    <div>
                        <span class="block text-[10px] font-extrabold uppercase opacity-65 tracking-wider">WIND</span>
                        <span id="windSpeed" class="text-xs sm:text-sm font-extrabold">-- km/h</span>
                    </div>
                </div>

                <!-- Humidity Card -->
                <div class="weather-card p-3 sm:p-3.5 rounded-2xl flex items-center gap-3">
                    <i data-lucide="droplets" class="w-6 h-6 text-oceanDark/80 stroke-[2] shrink-0"></i>
                    <div>
                        <span class="block text-[10px] font-extrabold uppercase opacity-65 tracking-wider">HUMIDITY</span>
                        <span id="humidity" class="text-xs sm:text-sm font-extrabold">--%</span>
                    </div>
                </div>

                <!-- Precipitation Card -->
                <div class="weather-card p-3 sm:p-3.5 rounded-2xl flex items-center gap-3">
                    <i data-lucide="cloud-rain" class="w-6 h-6 text-oceanDark/80 stroke-[2] shrink-0"></i>
                    <div>
                        <span class="block text-[10px] font-extrabold uppercase opacity-65 tracking-wider">PRECIP.</span>
                        <span id="precipitation" class="text-xs sm:text-sm font-extrabold">-- mm</span>
                    </div>
                </div>

                <!-- UV Index Card -->
                <div class="weather-card p-3 sm:p-3.5 rounded-2xl flex items-center gap-3">
                    <i data-lucide="sun-medium" class="w-6 h-6 text-oceanDark/80 stroke-[2] shrink-0"></i>
                    <div>
                        <span class="block text-[10px] font-extrabold uppercase opacity-65 tracking-wider">UV INDEX</span>
                        <span id="uvIndex" class="text-xs sm:text-sm font-extrabold">--</span>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        let isCelsius = true;
        let currentLat = 43.6833; // Fallback: Brampton, Canada
        let currentLon = -79.7667;
        let currentLocationLabel = "Brampton, Canada";

        // Map Open-Meteo Weather Codes to Lucide icons & labels
        const weatherCodeMap = {
            0: { icon: 'sun', text: 'Clear Sky' },
            1: { icon: 'sun-medium', text: 'Mainly Clear' },
            2: { icon: 'cloud-sun', text: 'Partly Cloudy' },
            3: { icon: 'cloud', text: 'Overcast' },
            45: { icon: 'cloud-fog', text: 'Foggy' },
            48: { icon: 'cloud-fog', text: 'Rime Fog' },
            51: { icon: 'cloud-drizzle', text: 'Light Drizzle' },
            53: { icon: 'cloud-drizzle', text: 'Moderate Drizzle' },
            55: { icon: 'cloud-drizzle', text: 'Dense Drizzle' },
            61: { icon: 'cloud-rain', text: 'Slight Rain' },
            63: { icon: 'cloud-rain', text: 'Moderate Rain' },
            65: { icon: 'cloud-rain-wind', text: 'Heavy Rain' },
            71: { icon: 'cloud-snow', text: 'Slight Snow' },
            73: { icon: 'cloud-snow', text: 'Moderate Snow' },
            75: { icon: 'cloud-snow', text: 'Heavy Snow' },
            80: { icon: 'cloud-rain', text: 'Rain Showers' },
            81: { icon: 'cloud-rain', text: 'Moderate Showers' },
            82: { icon: 'cloud-lightning', text: 'Violent Showers' },
            95: { icon: 'cloud-lightning', text: 'Thunderstorm' },
            96: { icon: 'cloud-hail', text: 'Thunderstorm w/ Hail' }
        };

        function getWeatherMeta(code) {
            return weatherCodeMap[code] || { icon: 'sun', text: 'Clear Sky' };
        }

        function formatTemp(tempC) {
            if (tempC === null || tempC === undefined) return '--°';
            if (!isCelsius) {
                const tempF = (tempC * 9/5) + 32;
                return Math.round(tempF) + '°';
            }
            return Math.round(tempC) + '°';
        }

        function toggleUnit() {
            isCelsius = !isCelsius;
            document.getElementById('unitBtn').textContent = isCelsius ? '°C' : '°F';
            fetchWeatherData(currentLat, currentLon, currentLocationLabel);
        }

        function detectLocation() {
            if (navigator.geolocation) {
                document.getElementById('locationName').textContent = "Detecting location...";
                navigator.geolocation.getCurrentPosition(
                    position => {
                        currentLat = position.coords.latitude;
                        currentLon = position.coords.longitude;
                        reverseGeocode(currentLat, currentLon);
                    },
                    error => {
                        console.warn("Geolocation fallback to default.");
                        fetchWeatherData(currentLat, currentLon, currentLocationLabel);
                    }
                );
            } else {
                fetchWeatherData(currentLat, currentLon, currentLocationLabel);
            }
        }

        async function reverseGeocode(lat, lon) {
            try {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${lat},${lon}&count=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    currentLocationLabel = `${data.results[0].name}, ${data.results[0].country_code.toUpperCase()}`;
                } else {
                    currentLocationLabel = "Your Location";
                }
            } catch (e) {
                currentLocationLabel = "Your Location";
            }
            fetchWeatherData(lat, lon, currentLocationLabel);
        }

        async function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('cityInput').value.trim();
            if (!query) return;

            try {
                document.getElementById('locationName').textContent = "Searching...";
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    const place = data.results[0];
                    currentLat = place.latitude;
                    currentLon = place.longitude;
                    currentLocationLabel = `${place.name}${place.admin1 ? ', ' + place.admin1 : ''}, ${place.country_code.toUpperCase()}`;
                    document.getElementById('cityInput').value = '';
                    fetchWeatherData(currentLat, currentLon, currentLocationLabel);
                } else {
                    document.getElementById('locationName').textContent = currentLocationLabel;
                }
            } catch (err) {
                console.error("Search error:", err);
            }
        }

        async function fetchWeatherData(lat, lon, label) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto`;
                
                const response = await fetch(url);
                const data = await response.json();

                renderCurrentWeather(data, label);
                lucide.createIcons();
            } catch (error) {
                console.error("Error fetching weather data:", error);
                document.getElementById('locationName').textContent = "Failed to load weather";
            }
        }

        function renderCurrentWeather(data, label) {
            const current = data.current;
            const daily = data.daily;
            const codeMeta = getWeatherMeta(current.weather_code);

            document.getElementById('locationName').textContent = label;
            document.getElementById('currentTemp').textContent = formatTemp(current.temperature_2m);
            document.getElementById('weatherCondition').textContent = codeMeta.text;
            document.getElementById('tempHigh').textContent = formatTemp(daily.temperature_2m_max[0]);
            document.getElementById('tempLow').textContent = formatTemp(daily.temperature_2m_min[0]);
            document.getElementById('feelsLike').textContent = formatTemp(current.apparent_temperature);

            document.getElementById('windSpeed').textContent = `${Math.round(current.wind_speed_10m)} km/h`;
            document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
            document.getElementById('precipitation').textContent = `${current.precipitation} mm`;
            document.getElementById('uvIndex').textContent = daily.uv_index_max[0] ? Math.round(daily.uv_index_max[0]) : '0';

            // Update main weather icon
            const iconContainer = document.getElementById('weatherIconContainer');
            iconContainer.innerHTML = `<i data-lucide="${codeMeta.icon}" class="w-12 h-12 sm:w-14 sm:h-14 text-oceanDark stroke-[2]"></i>`;
        }

        // Initialize on window load
        window.onload = function() {
            detectLocation();
        };
    </script>
</body>
</html>
